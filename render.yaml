services:
  # Backend API Service
  - type: web
    name: medknock-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medknock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: medknock-redis
          property: connectionString
      - key: PORT
        value: 10000

  # Background Worker Service
  - type: worker
    name: medknock-worker
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medknock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: medknock-redis
          property: connectionString

  # Redis instance for BullMQ
  - type: redis
    name: medknock-redis
    plan: free

databases:
  # PostgreSQL Database for Prisma
  - name: medknock-db
    plan: free
